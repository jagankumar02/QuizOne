/* =====================================================
   QUIZONE DASHBOARD AI CHAT + SYLLABUS
===================================================== */

const QUIZONE_AI_ENDPOINT =
    "http://127.0.0.1:5000/api/ai/generate";

let dashboardAIHistory = [];


/* =====================================================
   SAFE HTML
===================================================== */

function escapeDashboardAI(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   DASHBOARD AI CHAT
===================================================== */

 
async function sendDashboardAIChat(message) {

    const response = await fetch(
        "http://127.0.0.1:5000/api/ai/chat",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message,
                history: dashboardAIHistory
            })
        }
    );

    let result;

    try {

        result = await response.json();

    } catch (error) {

        throw new Error(
            "AI server returned an invalid response."
        );

    }

    if (
        !response.ok ||
        !result.success
    ) {

        throw new Error(
            result.error ||
            "AI request failed."
        );

    }

    return result.data;
}




/* =====================================================
   CHAT UI
===================================================== */

function addDashboardChatMessage(
    message,
    type
) {

    const box =
        document.getElementById(
            "dashboardAIChatMessages"
        );


    if (!box) return;


    const div =
        document.createElement("div");


    div.className =
        `ai-chat-message ${type}`;


    div.innerHTML =
        escapeDashboardAI(message)
            .replace(/\n/g, "<br>");


    box.appendChild(div);


    box.scrollTop =
        box.scrollHeight;

}


/* =====================================================
   INITIALIZE CHAT
===================================================== */

function initializeDashboardAIChat() {

    const form =
        document.getElementById(
            "dashboardAIChatForm"
        );


    if (!form) return;


    if (
        form.dataset.initialized ===
        "true"
    ) {

        return;

    }


    form.dataset.initialized =
        "true";


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const input =
                document.getElementById(
                    "dashboardAIChatInput"
                );


            const sendButton =
                document.getElementById(
                    "dashboardAIChatSend"
                );


            if (!input) return;


            const message =
                input.value.trim();


            if (!message) return;


            addDashboardChatMessage(
                message,
                "user"
            );


            input.value = "";


            input.disabled = true;


            if (sendButton) {

                sendButton.disabled =
                    true;

                sendButton.innerHTML = `
                    <i data-lucide="loader-circle"></i>
                `;

                if (
                    typeof lucide !==
                    "undefined"
                ) {

                    lucide.createIcons();

                }

            }


            const box =
                document.getElementById(
                    "dashboardAIChatMessages"
                );


            const loading =
                document.createElement(
                    "div"
                );


            loading.className =
                "ai-chat-message ai ai-thinking";


            loading.id =
                "dashboardAILoading";


            loading.textContent =
                "QuizOne AI is thinking...";


            box.appendChild(loading);


            box.scrollTop =
                box.scrollHeight;


            try {

                const data =
                    await sendDashboardAIChat(
                        message
                    );


                loading.remove();


                const reply =
                    data?.reply ||
                    data?.answer ||
                    data?.message;


                if (!reply) {

                    throw new Error(
                        "AI did not return a reply."
                    );

                }


                dashboardAIHistory.push({

                    role: "user",

                    content: message

                });


                dashboardAIHistory.push({

                    role: "model",

                    content: reply

                });


                addDashboardChatMessage(
                    reply,
                    "ai"
                );


            } catch (error) {

                loading.remove();


                addDashboardChatMessage(
                    "QuizOne AI is unavailable right now. Make sure Flask is running at http://127.0.0.1:5000 and try again.",
                    "ai"
                );


                console.error(
                    "Dashboard AI Chat Error:",
                    error
                );

            }


            input.disabled = false;


            if (sendButton) {

                sendButton.disabled =
                    false;

                sendButton.innerHTML = `
                    <i data-lucide="send"></i>
                `;


                if (
                    typeof lucide !==
                    "undefined"
                ) {

                    lucide.createIcons();

                }

            }


            input.focus();

        }
    );

}


/* =====================================================
   SYLLABUS FILE SELECTION
===================================================== */

function initializeSyllabusAI() {

    const fileInput =
        document.getElementById(
            "syllabusFile"
        );


    const fileName =
        document.getElementById(
            "syllabusFileName"
        );


    const analyzeButton =
        document.getElementById(
            "analyzeSyllabusBtn"
        );


    if (
        !fileInput ||
        !fileName ||
        !analyzeButton
    ) {

        return;

    }


    if (
        fileInput.dataset.initialized ===
        "true"
    ) {

        return;

    }


    fileInput.dataset.initialized =
        "true";


    fileInput.addEventListener(
        "change",
        function() {

            const file =
                fileInput.files?.[0];


            if (!file) {

                fileName.style.display =
                    "none";

                analyzeButton.disabled =
                    true;

                return;

            }


            const allowedTypes = [
                "application/pdf",

                "application/vnd.openxmlformats-officedocument.wordprocessingml.document",

                "text/plain"
            ];


            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const allowedExtensions = [
                "pdf",
                "docx",
                "txt"
            ];


            if (
                !allowedExtensions.includes(
                    extension
                )
            ) {

                alert(
                    "Please upload a PDF, DOCX or TXT file."
                );


                fileInput.value = "";

                analyzeButton.disabled =
                    true;

                return;

            }


            if (
                file.size >
                10 * 1024 * 1024
            ) {

                alert(
                    "Syllabus file must be smaller than 10 MB."
                );


                fileInput.value = "";

                analyzeButton.disabled =
                    true;

                return;

            }


            fileName.style.display =
                "block";


            fileName.innerHTML = `
                <i data-lucide="file-text"></i>
                ${escapeDashboardAI(file.name)}
            `;


            analyzeButton.disabled =
                false;


            if (
                typeof lucide !==
                "undefined"
            ) {

                lucide.createIcons();

            }

        }
    );


    analyzeButton.addEventListener(
        "click",
        analyzeDashboardSyllabus
    );

}


/* =====================================================
   SYLLABUS ANALYSIS
===================================================== */

async function analyzeDashboardSyllabus() {

    const fileInput =
        document.getElementById(
            "syllabusFile"
        );


    const resultBox =
        document.getElementById(
            "syllabusResult"
        );


    const button =
        document.getElementById(
            "analyzeSyllabusBtn"
        );


    const file =
        fileInput?.files?.[0];


    if (!file) {

        return;

    }


    resultBox.style.display =
        "block";


    resultBox.innerHTML = `
        <div class="ai-thinking">
            <i data-lucide="loader-circle"></i>
            AI is reading your syllabus...
        </div>
    `;


    button.disabled =
        true;


    if (
        typeof lucide !==
        "undefined"
    ) {

        lucide.createIcons();

    }


    try {

        const formData =
            new FormData();


        formData.append(
            "syllabus",
            file
        );


        const response =
            await fetch(
                "http://127.0.0.1:5000/api/ai/syllabus",
                {
                    method: "POST",
                    body: formData
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Syllabus analysis failed."
            );

        }


        const data =
            result.data || {};


        const subjects =
            Array.isArray(data.subjects)
                ? data.subjects
                : [];


        const topics =
            Array.isArray(data.topics)
                ? data.topics
                : [];


        const plan =
            data.study_plan ||
            data.studyPlan ||
            "Your syllabus has been analyzed successfully.";


        resultBox.innerHTML = `

            <strong>
                ✨ AI Syllabus Analysis
            </strong>

            <br><br>

            <strong>
                Subjects:
            </strong>

            ${
                subjects.length
                    ? subjects
                        .map(
                            subject =>
                                escapeDashboardAI(
                                    subject
                                )
                        )
                        .join(", ")
                    : "Detected from your syllabus"
            }

            <br><br>

            <strong>
                Important Topics:
            </strong>

            <ul style="
                margin:7px 0 0 17px;
                padding:0;
            ">

                ${
                    topics.length
                        ? topics
                            .slice(0, 8)
                            .map(
                                topic =>
                                    `<li>${escapeDashboardAI(topic)}</li>`
                            )
                            .join("")
                        : "<li>AI identified the syllabus successfully.</li>"
                }

            </ul>

            <br>

            <strong>
                Study Plan:
            </strong>

            <br>

            ${escapeDashboardAI(plan)
                .replace(/\n/g, "<br>")}

        `;


    } catch (error) {

        console.error(
            "Syllabus AI Error:",
            error
        );


        resultBox.innerHTML = `
            <span style="color:var(--danger);">
                ❌ ${escapeDashboardAI(
                    error.message ||
                    "Unable to analyze syllabus."
                )}
            </span>
        `;

    }


    button.disabled =
        false;

}
