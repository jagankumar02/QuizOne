<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizOne</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #635bff;
            --primary-dark: #5147e8;
            --primary-light: #eeecff;

            --bg: #f7f8fc;
            --card: #ffffff;

            --text: #171827;
            --muted: #73758a;
            --border: #e9e9f1;

            --success: #16a34a;
            --danger: #ef4444;

            --sidebar-width: 250px;
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: var(--sidebar-width);
            height: 100vh;

            background: white;
            border-right: 1px solid var(--border);

            padding: 25px 16px;

            display: flex;
            flex-direction: column;

            z-index: 100;

            transition: transform 0.25s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            padding: 0 10px;
            margin-bottom: 35px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #635bff,
                #8b7cff
            );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;
            font-weight: 800;

            box-shadow:
                0 7px 18px rgba(99, 91, 255, 0.25);
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-name span {
            color: var(--primary);
        }

        .nav-title {
            font-size: 11px;
            font-weight: 700;

            color: #a1a2b2;

            text-transform: uppercase;
            letter-spacing: 1px;

            padding: 0 12px;
            margin-bottom: 10px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-item {
            border: none;
            background: transparent;

            width: 100%;

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 12px 13px;

            border-radius: 11px;

            color: #686a7e;

            font-size: 13px;
            font-weight: 600;

            text-align: left;

            transition:
                background 0.2s,
                color 0.2s,
                transform 0.2s;
        }

        .nav-item:hover {
            background: #f5f4ff;
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item i {
            width: 18px;
            height: 18px;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .profile-mini {
            padding: 13px;

            border: 1px solid var(--border);
            border-radius: 13px;

            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 10px;
        }

        .avatar {
            width: 37px;
            height: 37px;

            border-radius: 50%;

            background: var(--primary-light);
            color: var(--primary);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;
            font-weight: 800;

            flex-shrink: 0;
        }

        .profile-mini-info {
            min-width: 0;
        }

        .profile-mini-name {
            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-mini-email {
            font-size: 10px;
            color: var(--muted);

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            margin-top: 2px;
        }

        .logout-btn {
            width: 100%;

            border: none;
            background: transparent;

            color: #73758a;

            padding: 11px 13px;

            display: flex;
            align-items: center;

            gap: 13px;

            border-radius: 10px;

            font-size: 13px;
            font-weight: 600;

            text-align: left;
        }

        .logout-btn:hover {
            background: #fff1f1;
            color: var(--danger);
        }

        /* =========================
           MOBILE HEADER
        ========================= */

        .mobile-header {
            display: none;

            height: 65px;

            background: white;
            border-bottom: 1px solid var(--border);

            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            position: sticky;
            top: 0;

            z-index: 90;
        }

        .mobile-header .brand {
            margin: 0;
        }

        .menu-btn {
            border: none;
            background: transparent;

            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: var(--sidebar-width);

            min-height: 100vh;

            padding: 32px;

            transition:
                opacity 0.18s ease,
                transform 0.18s ease;
        }

        .main.page-changing {
            opacity: 0;
            transform: translateY(5px);
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 28px;
        }

        .welcome h1 {
            font-size: 26px;
            letter-spacing: -0.8px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: var(--muted);
            font-size: 13px;
        }

        .date-box {
            display: flex;
            align-items: center;

            gap: 8px;

            color: var(--muted);

            font-size: 12px;

            background: white;

            border: 1px solid var(--border);

            padding: 10px 13px;

            border-radius: 10px;
        }

        /* =========================
           PAGE CONTENT
        ========================= */

        #pageContent {
            min-height: 500px;
        }

        /* =========================
           DASHBOARD HERO
        ========================= */

        .hero {
            background:
                linear-gradient(
                    120deg,
                    #635bff,
                    #776eff
                );

            border-radius: 18px;

            padding: 27px 29px;

            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;

            overflow: hidden;

            position: relative;

            margin-bottom: 24px;

            box-shadow:
                0 14px 35px rgba(99, 91, 255, 0.16);
        }

        .hero::after {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            background: rgba(255,255,255,0.07);

            right: -70px;
            top: -100px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-label {
            font-size: 11px;
            font-weight: 700;

            opacity: 0.8;

            margin-bottom: 7px;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero h2 {
            font-size: 21px;
            margin-bottom: 7px;
        }

        .hero p {
            font-size: 12px;
            opacity: 0.86;
            max-width: 500px;
        }

        .hero-btn {
            position: relative;
            z-index: 2;

            border: none;

            background: white;
            color: var(--primary);

            padding: 12px 17px;

            border-radius: 10px;

            font-weight: 700;
            font-size: 12px;

            display: flex;
            align-items: center;

            gap: 7px;

            white-space: nowrap;
        }

        /* =========================
           STATS
        ========================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 16px;

            margin-bottom: 24px;
        }

        .stat-card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 15px;

            padding: 18px;
        }

        .stat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 17px;
        }

        .stat-icon {
            width: 36px;
            height: 36px;

            border-radius: 10px;

            background: var(--primary-light);
            color: var(--primary);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-change {
            font-size: 10px;

            color: var(--success);

            font-weight: 700;
        }

        .stat-value {
            font-size: 25px;

            font-weight: 800;

            letter-spacing: -0.7px;
        }

        .stat-label {
            font-size: 11px;

            color: var(--muted);

            margin-top: 4px;
        }

        /* =========================
           CONTENT GRID
        ========================= */

        .content-grid {
            display: grid;

            grid-template-columns:
                1.6fr 1fr;

            gap: 20px;
        }

        .card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
        }

        .card-link {
            border: none;
            background: transparent;

            color: var(--primary);

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;
        }

        /* =========================
           QUICK ACTIONS
        ========================= */

        .quick-actions {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }

        .action-card {
            border: 1px solid var(--border);

            border-radius: 13px;

            padding: 17px;

            cursor: pointer;

            transition:
                border 0.2s,
                transform 0.2s,
                box-shadow 0.2s;
        }

        .action-card:hover {
            border-color: #cfcaff;

            transform: translateY(-2px);

            box-shadow:
                0 7px 20px rgba(30,30,60,0.05);
        }

        .action-icon {
            width: 35px;
            height: 35px;

            background: var(--primary-light);
            color: var(--primary);

            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 12px;
        }

        .action-card h3 {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .action-card p {
            color: var(--muted);

            font-size: 10px;

            line-height: 1.5;
        }

        /* =========================
           ACTIVITY
        ========================= */

        .activity-list {
            display: flex;
            flex-direction: column;
        }

        .activity-item {
            display: flex;
            align-items: center;

            gap: 11px;

            padding: 12px 0;

            border-bottom:
                1px solid #f0f0f5;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 34px;
            height: 34px;

            border-radius: 9px;

            background: #f5f4ff;
            color: var(--primary);

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .activity-info {
            flex: 1;
            min-width: 0;
        }

        .activity-info strong {
            font-size: 11px;

            display: block;

            margin-bottom: 3px;
        }

        .activity-info span {
            font-size: 9px;
            color: var(--muted);
        }

        .activity-score {
            font-size: 11px;

            font-weight: 800;

            color: var(--success);
        }

        .empty-state {
            text-align: center;

            padding: 30px 10px;

            color: var(--muted);
        }

        .empty-state i {
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 11px;
        }

        /* =========================
           PROGRESS
        ========================= */

        .progress-box {
            margin-top: 20px;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;
        }

        .progress-top span {
            font-size: 11px;
            font-weight: 700;
        }

        .progress-top span:last-child {
            color: var(--primary);
        }

        .progress-bar {
            width: 100%;
            height: 7px;

            border-radius: 20px;

            background: #eeeeF5;

            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;

            background: var(--primary);

            border-radius: inherit;

            transition:
                width 0.5s ease;
        }

        /* =========================
           INNER PAGES
        ========================= */

        .inner-page {
            animation: pageIn 0.25s ease;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-heading {
            margin-bottom: 24px;
        }

        .page-heading h2 {
            font-size: 25px;
            letter-spacing: -0.7px;
            margin-bottom: 6px;
        }

        .page-heading p {
            color: var(--muted);
            font-size: 13px;
        }

        .feature-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 16px;
        }

        .feature-card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 22px;
        }

        .feature-icon {
            width: 44px;
            height: 44px;

            border-radius: 12px;

            background: var(--primary-light);
            color: var(--primary);

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 16px;
        }

        .feature-card h3 {
            font-size: 14px;
            margin-bottom: 7px;
        }

        .feature-card p {
            font-size: 11px;

            color: var(--muted);

            line-height: 1.6;
        }

        .coming-box {
            background: white;

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 40px 25px;

            text-align: center;
        }

        .coming-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 16px;

            border-radius: 16px;

            background: var(--primary-light);
            color: var(--primary);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coming-box h3 {
            font-size: 18px;
            margin-bottom: 7px;
        }

        .coming-box p {
            font-size: 12px;
            color: var(--muted);
        }

        /* =========================
           PROFILE PAGE
        ========================= */

        .profile-page-card {
            max-width: 760px;

            background: white;

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 25px;
        }

        .profile-page-top {
            display: flex;
            align-items: center;
            gap: 15px;

            padding-bottom: 20px;

            margin-bottom: 22px;

            border-bottom: 1px solid var(--border);
        }

        .large-avatar {
            width: 58px;
            height: 58px;

            border-radius: 50%;

            background: var(--primary-light);
            color: var(--primary);

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 800;
            font-size: 18px;
        }

        .profile-page-top h3 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .profile-page-top p {
            font-size: 11px;
            color: var(--muted);
        }

        .profile-info-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }

        .profile-field {
            padding: 15px;

            border: 1px solid var(--border);

            border-radius: 12px;
        }

        .profile-field span {
            display: block;

            color: var(--muted);

            font-size: 10px;

            margin-bottom: 6px;
        }

        .profile-field strong {
            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1100px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .feature-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-header {
                display: flex;
            }

            .main {
                margin-left: 0;

                padding:
                    22px 17px;
            }

            .topbar {
                align-items: flex-start;
            }

            .date-box {
                display: none;
            }

            .hero {
                padding: 22px;

                align-items: flex-start;

                gap: 18px;

                flex-direction: column;
            }

            .hero-btn {
                width: 100%;

                justify-content: center;
            }
        }

        @media (max-width: 550px) {

            .stats-grid {
                grid-template-columns:
                    1fr 1fr;

                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-value {
                font-size: 21px;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }

            .profile-info-grid {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 22px;
            }

            .hero h2 {
                font-size: 18px;
            }
        }


        /* =========================
   AI QUIZ BUILDER
========================= */

.quiz-builder {
    max-width: 850px;
}

.quiz-builder-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
}

.builder-icon {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: var(--primary-light);
    color: var(--primary);

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 15px;
}

.quiz-builder-card h3 {
    font-size: 19px;
    margin-bottom: 7px;
}

.builder-subtitle {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 17px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.form-group label {
    font-size: 11px;
    font-weight: 700;
}

.form-group input,
.form-group select {
    width: 100%;
    height: 44px;

    border: 1px solid var(--border);
    border-radius: 10px;

    padding: 0 13px;

    outline: none;

    color: var(--text);
    background: white;

    font-size: 12px;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
}

.timer-option {
    margin-top: 20px;

    padding: 14px;

    border: 1px solid var(--border);
    border-radius: 12px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.timer-option strong {
    display: block;
    font-size: 12px;
    margin-bottom: 4px;
}

.timer-option span {
    font-size: 10px;
    color: var(--muted);
}

.switch {
    position: relative;
    width: 42px;
    height: 23px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    inset: 0;

    background: #d9d9e3;

    border-radius: 20px;

    cursor: pointer;

    transition: 0.2s;
}

.slider::before {
    content: "";

    position: absolute;

    width: 17px;
    height: 17px;

    left: 3px;
    top: 3px;

    background: white;

    border-radius: 50%;

    transition: 0.2s;
}

.switch input:checked + .slider {
    background: var(--primary);
}

.switch input:checked + .slider::before {
    transform: translateX(19px);
}

.timer-select {
    margin-top: 15px;
}

.quiz-error {
    display: none;

    margin-top: 15px;

    padding: 11px;

    border-radius: 9px;

    background: #fff1f1;
    color: var(--danger);

    font-size: 11px;
}

.generate-btn {
    width: 100%;

    height: 46px;

    border: none;

    border-radius: 11px;

    background: var(--primary);
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    font-size: 12px;
    font-weight: 700;

    margin-top: 20px;

    transition: 0.2s;
}

.generate-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

.generate-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
}

/* =========================
   QUIZ AREA
========================= */

.quiz-area {
    max-width: 850px;
    margin-top: 22px;
}

.quiz-running {
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 25px;
}

.quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 22px;
}

.quiz-progress-text {
    font-size: 11px;
    color: var(--muted);
}

.quiz-timer {
    display: flex;
    align-items: center;
    gap: 7px;

    background: var(--primary-light);
    color: var(--primary);

    padding: 8px 12px;

    border-radius: 9px;

    font-size: 11px;
    font-weight: 800;
}

.quiz-question {
    font-size: 17px;
    line-height: 1.6;

    margin-bottom: 20px;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.option {
    width: 100%;

    padding: 14px;

    border: 1px solid var(--border);
    border-radius: 11px;

    background: white;

    text-align: left;

    font-size: 12px;

    transition: 0.2s;
}

.option:hover {
    border-color: #c8c4ff;
    background: #faf9ff;
}

.option.selected {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
}

.quiz-actions {
    display: flex;
    justify-content: space-between;

    margin-top: 22px;
}

.quiz-nav-btn {
    border: none;

    padding: 11px 17px;

    border-radius: 9px;

    font-size: 11px;
    font-weight: 700;
}

.quiz-nav-btn.secondary {
    background: #f1f1f6;
    color: var(--text);
}

.quiz-nav-btn.primary {
    background: var(--primary);
    color: white;
}

.quiz-nav-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* =========================
   RESULT
========================= */

.quiz-result {
    background: white;

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 35px;

    text-align: center;
}

.result-circle {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    background: var(--primary-light);
    color: var(--primary);

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 18px;

    font-size: 25px;
    font-weight: 800;
}

.quiz-result h2 {
    font-size: 21px;
    margin-bottom: 7px;
}

.quiz-result p {
    font-size: 12px;
    color: var(--muted);
}

.result-stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-top: 25px;
}

.result-stat {
    border: 1px solid var(--border);

    border-radius: 11px;

    padding: 15px;
}

.result-stat strong {
    display: block;

    font-size: 19px;

    margin-bottom: 4px;
}

.result-stat span {
    color: var(--muted);

    font-size: 10px;
}

@media (max-width: 600px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

    .quiz-builder-card,
    .quiz-running,
    .quiz-result {
        padding: 19px;
    }

    .result-stats {
        grid-template-columns: 1fr;
    }
}

.quiz-error {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
}

/* =========================================================
   QUIZONE — PREMIUM GLASS / HOVER VISUAL OVERRIDES
   Only visual styling — no HTML / JS / layout functionality
========================================================= */

:root {
    --primary: #4059AD;
    --primary-dark: #31478F;
    --primary-light: #EAF0FA;

    --secondary: #6B9AC4;
    --mint: #97D8C4;
    --gold: #F4B942;

    --bg: #F5F8FC;
    --card: rgba(255, 255, 255, 0.72);

    --text: #172033;
    --muted: #6F778A;
    --border: rgba(64, 89, 173, 0.12);

    --success: #16A34A;
    --danger: #EF4444;

    --sidebar-width: 250px;

    --glass-border: rgba(255, 255, 255, 0.72);
    --glass-shadow: 0 12px 35px rgba(45, 65, 120, 0.08);
    --hover-shadow: 0 18px 42px rgba(64, 89, 173, 0.14);

    --transition: 0.28s cubic-bezier(0.2, 0.7, 0.2, 1);
}


/* =========================================================
   BODY
========================================================= */

body {
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(151, 216, 196, 0.14),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(107, 154, 196, 0.13),
            transparent 30%
        ),
        var(--bg);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    background: rgba(255, 255, 255, 0.76);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-right: 1px solid var(--glass-border);

    box-shadow:
        8px 0 30px rgba(45, 65, 120, 0.035);
}


/* =========================================================
   BRAND
========================================================= */

.brand-logo {
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    box-shadow:
        0 8px 22px rgba(64, 89, 173, 0.24);

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.brand-logo:hover {
    transform: translateY(-2px) rotate(-2deg);

    box-shadow:
        0 13px 28px rgba(64, 89, 173, 0.30);
}

.brand-name span {
    color: var(--primary);
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav-item {
    position: relative;

    transition:
        background var(--transition),
        color var(--transition),
        transform var(--transition),
        box-shadow var(--transition);
}

.nav-item:hover {
    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.08),
            rgba(151, 216, 196, 0.10)
        );

    color: var(--primary);

    transform: translateX(3px);
}

.nav-item.active {
    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.12),
            rgba(151, 216, 196, 0.14)
        );

    color: var(--primary);

    box-shadow:
        inset 3px 0 0 var(--primary);
}

.nav-item i {
    transition: transform var(--transition);
}

.nav-item:hover i {
    transform: scale(1.08);
}


/* =========================================================
   PROFILE MINI
========================================================= */

.profile-mini {
    background: rgba(255, 255, 255, 0.55);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
}

.profile-mini:hover {
    transform: translateY(-2px);

    border-color:
        rgba(64, 89, 173, 0.20);

    box-shadow:
        0 10px 25px rgba(45, 65, 120, 0.07);
}


/* =========================================================
   AVATARS
========================================================= */

.avatar,
.large-avatar {
    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.12),
            rgba(151, 216, 196, 0.24)
        );

    color: var(--primary);
}


/* =========================================================
   LOGOUT
========================================================= */

.logout-btn {
    transition:
        background var(--transition),
        color var(--transition),
        transform var(--transition);
}

.logout-btn:hover {
    transform: translateX(3px);
}


/* =========================================================
   MOBILE HEADER
========================================================= */

.mobile-header {
    background: rgba(255, 255, 255, 0.80);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom: 1px solid var(--glass-border);
}


/* =========================================================
   DATE BOX
========================================================= */

.date-box {
    background: rgba(255, 255, 255, 0.68);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.date-box:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 25px rgba(45, 65, 120, 0.07);
}


/* =========================================================
   HERO
========================================================= */

.hero {
    background:
        linear-gradient(
            120deg,
            #4059AD 0%,
            #557DB7 48%,
            #6B9AC4 100%
        );

    box-shadow:
        0 18px 45px rgba(64, 89, 173, 0.20);

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.hero:hover {
    transform: translateY(-2px);

    box-shadow:
        0 24px 55px rgba(64, 89, 173, 0.24);
}

.hero::before {
    content: "";

    position: absolute;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    right: 120px;
    bottom: -150px;

    background:
        rgba(151, 216, 196, 0.18);

    filter: blur(2px);
}

.hero::after {
    background:
        rgba(255, 255, 255, 0.10);

    box-shadow:
        0 0 80px rgba(255, 255, 255, 0.08);
}

.hero-btn {
    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.hero-btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 10px 25px rgba(20, 35, 80, 0.20);
}

.hero-btn:active {
    transform: scale(0.97);
}


/* =========================================================
   STAT CARDS
========================================================= */

.stat-card {
    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.86),
            rgba(255, 255, 255, 0.62)
        );

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border: 1px solid var(--glass-border);

    box-shadow:
        var(--glass-shadow);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
}

.stat-card:hover {
    transform: translateY(-6px);

    border-color:
        rgba(64, 89, 173, 0.20);

    box-shadow:
        var(--hover-shadow);
}

.stat-icon {
    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.12),
            rgba(151, 216, 196, 0.22)
        );

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.stat-card:hover .stat-icon {
    transform:
        scale(1.10)
        rotate(-3deg);

    box-shadow:
        0 7px 18px rgba(64, 89, 173, 0.12);
}


/* =========================================================
   GENERAL CARDS
========================================================= */

.card,
.feature-card,
.coming-box,
.profile-page-card,
.quiz-builder-card,
.quiz-running,
.quiz-result {
    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.86),
            rgba(255, 255, 255, 0.68)
        );

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    border: 1px solid var(--glass-border);

    box-shadow:
        var(--glass-shadow);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
}


/* =========================================================
   CARD HOVER
========================================================= */

.card:hover,
.feature-card:hover,
.coming-box:hover {
    transform: translateY(-4px);

    border-color:
        rgba(64, 89, 173, 0.16);

    box-shadow:
        var(--hover-shadow);
}


/* =========================================================
   CARD HEADERS
========================================================= */

.card-link {
    transition:
        color var(--transition),
        transform var(--transition);
}

.card-link:hover {
    color: var(--secondary);

    transform: translateX(3px);
}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.action-card {
    background:
        rgba(255, 255, 255, 0.56);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition),
        background var(--transition);
}

.action-card:hover {
    border-color:
        rgba(64, 89, 173, 0.25);

    transform: translateY(-6px);

    background:
        rgba(255, 255, 255, 0.82);

    box-shadow:
        0 15px 35px rgba(64, 89, 173, 0.12);
}

.action-icon {
    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.12),
            rgba(151, 216, 196, 0.22)
        );

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.action-card:hover .action-icon {
    transform:
        scale(1.10)
        rotate(-4deg);

    box-shadow:
        0 8px 18px rgba(64, 89, 173, 0.12);
}


/* =========================================================
   ACTIVITY
========================================================= */

.activity-item {
    transition:
        background var(--transition),
        padding-left var(--transition);
}

.activity-item:hover {
    padding-left: 5px;
}

.activity-icon {
    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.10),
            rgba(151, 216, 196, 0.18)
        );

    transition:
        transform var(--transition);
}

.activity-item:hover .activity-icon {
    transform: scale(1.08);
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-bar {
    background:
        rgba(64, 89, 173, 0.08);
}

.progress-fill {
    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary),
            var(--mint)
        );

    box-shadow:
        0 2px 8px rgba(64, 89, 173, 0.20);
}


/* =========================================================
   FEATURE ICONS
========================================================= */

.feature-icon,
.coming-icon,
.builder-icon {
    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.12),
            rgba(151, 216, 196, 0.22)
        );

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.feature-card:hover .feature-icon,
.coming-box:hover .coming-icon {
    transform:
        scale(1.08)
        rotate(-3deg);

    box-shadow:
        0 9px 22px rgba(64, 89, 173, 0.12);
}


/* =========================================================
   PROFILE FIELDS
========================================================= */

.profile-field {
    background:
        rgba(255, 255, 255, 0.50);

    transition:
        transform var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
}

.profile-field:hover {
    transform: translateY(-3px);

    border-color:
        rgba(64, 89, 173, 0.20);

    box-shadow:
        0 10px 25px rgba(45, 65, 120, 0.06);
}


/* =========================================================
   FORM INPUTS
========================================================= */

.form-group input,
.form-group select {
    background:
        rgba(255, 255, 255, 0.72);

    transition:
        border-color var(--transition),
        box-shadow var(--transition),
        background var(--transition);
}

.form-group input:hover,
.form-group select:hover {
    border-color:
        rgba(64, 89, 173, 0.25);

    background:
        rgba(255, 255, 255, 0.90);
}

.form-group input:focus,
.form-group select:focus {
    border-color:
        var(--primary);

    background:
        rgba(255, 255, 255, 0.95);

    box-shadow:
        0 0 0 4px rgba(64, 89, 173, 0.10),
        0 8px 22px rgba(64, 89, 173, 0.08);
}


/* =========================================================
   TIMER SWITCH
========================================================= */

.slider {
    background:
        #D7DDE8;

    transition:
        background var(--transition),
        box-shadow var(--transition);
}

.switch input:checked + .slider {
    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    box-shadow:
        0 4px 12px rgba(64, 89, 173, 0.20);
}


/* =========================================================
   GENERATE BUTTON
========================================================= */

.generate-btn {
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    box-shadow:
        0 8px 20px rgba(64, 89, 173, 0.18);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        filter var(--transition);
}

.generate-btn:hover {
    background:
        linear-gradient(
            135deg,
            #4059AD,
            #5F91B8
        );

    transform: translateY(-3px);

    box-shadow:
        0 14px 30px rgba(64, 89, 173, 0.25);

    filter: brightness(1.03);
}

.generate-btn:active {
    transform: scale(0.98);
}


/* =========================================================
   QUIZ TIMER
========================================================= */

.quiz-timer {
    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.10),
            rgba(151, 216, 196, 0.20)
        );

    box-shadow:
        0 5px 15px rgba(64, 89, 173, 0.06);

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.quiz-timer:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(64, 89, 173, 0.10);
}


/* =========================================================
   QUIZ OPTIONS
========================================================= */

.option {
    background:
        rgba(255, 255, 255, 0.64);

    transition:
        transform var(--transition),
        border-color var(--transition),
        background var(--transition),
        box-shadow var(--transition);
}

.option:hover {
    border-color:
        rgba(64, 89, 173, 0.35);

    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.05),
            rgba(151, 216, 196, 0.08)
        );

    transform: translateX(4px);

    box-shadow:
        0 7px 18px rgba(64, 89, 173, 0.08);
}

.option.selected {
    border-color:
        var(--primary);

    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.10),
            rgba(151, 216, 196, 0.16)
        );

    box-shadow:
        0 8px 22px rgba(64, 89, 173, 0.10);
}


/* =========================================================
   QUIZ NAV BUTTONS
========================================================= */

.quiz-nav-btn {
    transition:
        transform var(--transition),
        box-shadow var(--transition),
        background var(--transition);
}

.quiz-nav-btn:not(:disabled):hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 18px rgba(45, 65, 120, 0.10);
}

.quiz-nav-btn:not(:disabled):active {
    transform: scale(0.97);
}

.quiz-nav-btn.primary {
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );
}

.quiz-nav-btn.secondary:hover {
    background:
        rgba(64, 89, 173, 0.08);
}


/* =========================================================
   RESULT CIRCLE
========================================================= */

.result-circle {
    background:
        linear-gradient(
            135deg,
            rgba(64, 89, 173, 0.12),
            rgba(151, 216, 196, 0.28)
        );

    box-shadow:
        0 12px 30px rgba(64, 89, 173, 0.10);

    transition:
        transform var(--transition),
        box-shadow var(--transition);
}

.quiz-result:hover .result-circle {
    transform: scale(1.05);

    box-shadow:
        0 16px 35px rgba(64, 89, 173, 0.14);
}


/* =========================================================
   RESULT STATS
========================================================= */

.result-stat {
    background:
        rgba(255, 255, 255, 0.50);

    transition:
        transform var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
}

.result-stat:hover {
    transform: translateY(-4px);

    border-color:
        rgba(64, 89, 173, 0.18);

    box-shadow:
        0 10px 25px rgba(45, 65, 120, 0.07);
}


/* =========================================================
   SUCCESS / ACHIEVEMENT ACCENT
   Yellow intentionally used only as a highlight
========================================================= */

.stat-change {
    color: var(--success);
}


/* =========================================================
   UNIVERSAL INTERACTION
========================================================= */

button,
.action-card,
.option,
.card-link,
.nav-item,
.profile-mini,
.profile-field {
    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   REDUCED MOTION ACCESSIBILITY
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}

/* =========================================================
   QUIZONE AI CENTER
========================================================= */

.ai-center {
    margin-top: 24px;
    display: grid;
    grid-template-columns: 1.35fr 0.85fr;
    gap: 20px;
}

.ai-panel {
    background: linear-gradient(
        145deg,
        rgba(255,255,255,0.90),
        rgba(255,255,255,0.68)
    );
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    box-shadow: var(--glass-shadow);
    overflow: hidden;
}

.ai-panel-header {
    padding: 20px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 13px;
}

.ai-panel-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(
        135deg,
        rgba(64,89,173,0.13),
        rgba(151,216,196,0.25)
    );
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.ai-panel-header h3 {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 3px;
}

.ai-panel-header p {
    font-size: 10px;
    color: var(--muted);
}

/* CHAT */

.ai-chat-box {
    height: 360px;
    display: flex;
    flex-direction: column;
}

.ai-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.ai-chat-message {
    max-width: 82%;
    padding: 11px 13px;
    border-radius: 13px;
    font-size: 11px;
    line-height: 1.55;
    word-wrap: break-word;
}

.ai-chat-message.ai {
    align-self: flex-start;
    background: rgba(64,89,173,0.08);
    color: var(--text);
    border-bottom-left-radius: 4px;
}

.ai-chat-message.user {
    align-self: flex-end;
    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
    color: white;
    border-bottom-right-radius: 4px;
}

.ai-chat-input-area {
    padding: 13px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 9px;
}

.ai-chat-input {
    flex: 1;
    min-width: 0;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 13px;
    outline: none;
    background: rgba(255,255,255,0.75);
    font-size: 11px;
}

.ai-chat-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(64,89,173,0.08);
}

.ai-chat-send {
    width: 44px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.ai-chat-send:hover {
    transform: translateY(-2px);
}

/* SYLLABUS */

.syllabus-content {
    padding: 20px;
}

.syllabus-upload-box {
    border: 1.5px dashed rgba(64,89,173,0.28);
    border-radius: 15px;
    padding: 25px 18px;
    text-align: center;
    background: rgba(64,89,173,0.035);
    cursor: pointer;
    transition: 0.25s ease;
}

.syllabus-upload-box:hover {
    border-color: var(--primary);
    background: rgba(64,89,173,0.07);
    transform: translateY(-2px);
}

.syllabus-upload-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 12px;
    border-radius: 13px;
    background: linear-gradient(
        135deg,

/* =========================================
   NAVIGATION
========================================= */

async function navigate(page, updateURL = true) {

    const main =
        document.getElementById("mainContent");

    const pageContent =
        document.getElementById("pageContent");


    main.classList.add("page-changing");


    await new Promise(resolve =>
        setTimeout(resolve, 120)
    );


    let html = "";
    let subtitle = "";


    switch (page) {

        case "quiz":

            html = quizPage();

            subtitle =
                "Create personalized AI-powered quizzes.";

            break;


        case "ai":

            html = aiAssistantPage();

            subtitle =
                "Chat with QuizOne AI and analyze your syllabus.";

            break;


        case "practice":

            html = practicePage();

            subtitle =
                "Practice questions and strengthen your concepts.";

            break;


        case "analytics":

            html = analyticsPage();

            subtitle =
                "Track your performance and learning progress.";

            break;


        case "profile":

            html = profilePage();

            subtitle =
                "Manage and view your QuizOne profile.";

            break;


        default:

            page = "dashboard";

            html = dashboardPage();

            subtitle =
                "Continue your preparation and keep improving.";

            break;

    }


    pageContent.innerHTML = html;


    const subtitleElement =
        document.getElementById("pageSubtitle");

    if (subtitleElement) {
        subtitleElement.textContent = subtitle;
    }


    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.page === page
            );

        });


    if (updateURL) {

        history.pushState(
            { page: page },
            "",
            "#" + page
        );

    }


    if (typeof lucide !== "undefined") {
        lucide.createIcons();
    }


    main.classList.remove("page-changing");


    attachDynamicNavigation();


    if (page === "dashboard") {
        loadQuizStats();
    }


    if (page === "quiz") {
        initializeQuizBuilder();
    }

}


/* =========================================
   DYNAMIC NAVIGATION
========================================= */

function attachDynamicNavigation() {

    document
        .querySelectorAll("[data-page]")
        .forEach(element => {

            if (
                element.dataset.navigationAttached ===
                "true"
            ) {
                return;
            }


            element.dataset.navigationAttached =
                "true";


            element.addEventListener(
                "click",
                event => {

                    event.preventDefault();


                    const page =
                        element.dataset.page;


                    if (page) {
                        navigate(page);
                    }


                    closeMobileSidebar();

                }
            );

        });

}

/* =========================================
   QUIZ STATS
========================================= */

async function loadQuizStats() {

    if (!currentUser) {
        return;
    }


    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("quiz_results")
            .select("*")
            .eq(
                "user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.log(
                "Quiz results not available yet:",
                error.message
            );

            return;

        }


        if (!data || data.length === 0) {

            return;

        }


        const total =
            data.length;


        const totalElement =
            document.getElementById(
                "totalQuizzes"
            );


        if (totalElement) {
            totalElement.textContent =
                total;
        }


        const scores =
            data
                .map(item => {

                    const percentage =
                        Number(item.percentage);

                    if (
                        !isNaN(percentage)
                    ) {
                        return percentage;
                    }


                    const score =
                        Number(item.score);

                    const totalQuestions =
                        Number(
                            item.total_questions
                        );


                    if (
                        totalQuestions > 0 &&
                        !isNaN(score)
                    ) {

                        return (
                            score /
                            totalQuestions
                        ) * 100;

                    }


                    return null;

                })
                .filter(
                    score =>
                        score !== null &&
                        !isNaN(score)
                );


        if (scores.length > 0) {

            const average =
                scores.reduce(
                    (sum, value) =>
                        sum + value,
                    0
                ) /
                scores.length;


            const best =
                Math.max(...scores);


            const averageElement =
                document.getElementById(
                    "averageScore"
                );


            const bestElement =
                document.getElementById(
                    "bestScore"
                );


            const progressElement =
                document.getElementById(
                    "progressPercent"
                );


            const progressFill =
                document.getElementById(
                    "progressFill"
                );


            if (averageElement) {

                averageElement.textContent =
                    `${Math.round(average)}%`;

            }


            if (bestElement) {

                bestElement.textContent =
                    `${Math.round(best)}%`;

            }


            if (progressElement) {

                progressElement.textContent =
                    `${Math.round(average)}%`;

            }


            if (progressFill) {

                progressFill.style.width =
                    `${Math.min(
                        Math.round(average),
                        100
                    )}%`;

            }

        }


        let questions = 0;


        data.forEach(item => {

            const totalQuestions =
                Number(
                    item.total_questions
                );


            if (
                !isNaN(totalQuestions)
            ) {

                questions +=
                    totalQuestions;

            }

        });


        const questionsElement =
            document.getElementById(
                "questionsPracticed"
            );


        if (questionsElement) {

            questionsElement.textContent =
                questions;

        }


        renderActivity(
            data.slice(0, 5)
        );


    } catch (error) {

        console.log(
            "Dashboard statistics error:",
            error
        );

    }

}

/* =========================================
   GENERATE AI QUIZ
========================================= */

async function generateAIQuiz() {

    const subject =
        document.getElementById(
            "quizSubject"
        )?.value.trim();


    const topic =
        document.getElementById(
            "quizTopic"
        )?.value.trim();


    const difficulty =
        document.getElementById(
            "quizDifficulty"
        )?.value;


    const count =
        Number(
            document.getElementById(
                "quizCount"
            )?.value
        );


    const enableTimer =
        document.getElementById(
            "enableTimer"
        )?.checked;


    const timeLimit =
        Number(
            document.getElementById(
                "quizTime"
            )?.value || 10
        );


    const button =
        document.getElementById(
            "generateQuizBtn"
        );


    if (!subject) {

        showQuizError(
            "Please enter a subject."
        );

        return;

    }


    if (!topic) {

        showQuizError(
            "Please enter a topic."
        );

        return;

    }


    button.disabled = true;


    button.innerHTML = `

        <i
            data-lucide="loader-circle"
        ></i>

        Generating Quiz...

    `;


    if (typeof lucide !== "undefined") {
        lucide.createIcons();
    }


    hideQuizError();


    try {

   const response = await fetch(
    "http://127.0.0.1:5000/api/ai/generate",
    {
        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            subject: subject,
            topic: topic,
            difficulty: difficulty,
            count: count,
            type: "mcq"
        })
    }
);


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Quiz generation failed"
            );

        }


        if (
            !result.questions ||
            !Array.isArray(result.questions) ||
            result.questions.length === 0
        ) {

            throw new Error(
                "No questions were generated."
            );

        }


        /* =====================================
           IMPORTANT
           Normalize backend response ONCE
        ===================================== */

        generatedQuiz =
            normalizeQuestions(
                result.questions
            );


        if (
            !generatedQuiz.length
        ) {

            throw new Error(
                "Generated questions have invalid answer data."
            );

        }


        if (
            generatedQuiz.length !==
            count
        ) {

            console.warn(
                `Requested ${count} questions but received ${generatedQuiz.length}.`
            );

        }


        /* =====================================
           RESET QUIZ
        ===================================== */

        currentQuestion = 0;


        selectedAnswers =
            new Array(
                generatedQuiz.length
            ).fill(null);


        clearInterval(
            quizTimerInterval
        );


        /* =====================================
           TIMER
        ===================================== */

        if (enableTimer) {

            quizSecondsLeft =
                timeLimit * 60;

        } else {

            quizSecondsLeft =
                0;

        }


        /* =====================================
           DEBUG
        ===================================== */

        console.log(
            "========== GENERATED QUIZ =========="
        );

        console.log(
            generatedQuiz
        );


        generatedQuiz.forEach(
            (question, index) => {

                console.log(
                    `Q${index + 1}`,
                    {
                        question:
                            question.question,

                        options:
                            question.options,

                        correctAnswer:
                            question.answer
                    }
                );

            }
        );


        /* =====================================
           SHOW FIRST QUESTION
        ===================================== */

        renderQuizQuestion();


        if (enableTimer) {

            startQuizTimer();

        }


    } catch (error) {

        console.error(
            "Quiz generation error:",
            error
        );


        showQuizError(
            error.message ||
            "Unable to generate quiz."
        );

    } finally {

        button.disabled = false;


        button.innerHTML = `

            <i data-lucide="wand-sparkles"></i>

            Generate AI Quiz

        `;


        if (typeof lucide !== "undefined") {
            lucide.createIcons();
        }

    }

}


/* =========================================
   NORMALIZE ANSWER
========================================= */

function normalizeAnswer(answer) {

    return String(
        answer ?? ""
    )
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();

}


/* =========================================
   NORMALIZE AI QUESTIONS
========================================= */

function normalizeQuestions(
    questions
) {

    return questions
        .map(q => {

            const options =
                Array.isArray(q.options)
                    ? q.options.map(
                        option =>
                            String(
                                option
                            ).trim()
                    )
                    : [];


            let correctAnswer =
                q.correct_answer ??
                q.correctAnswer ??
                q.answer;


            /* =================================
               NUMBER ANSWER
               Example: 2
            ================================= */

            if (
                typeof correctAnswer ===
                    "number" &&
                options[
                    correctAnswer
                ] !== undefined
            ) {

                correctAnswer =
                    options[
                        correctAnswer
                    ];

            }


            /* =================================
               STRING NUMBER ANSWER
               Example: "2"
            ================================= */

            if (
                typeof correctAnswer ===
                    "string" &&
                /^\d+$/.test(
                    correctAnswer.trim()
                )
            ) {

                const index =
                    Number(
                        correctAnswer.trim()
                    );


                if (
                    options[index] !==
                    undefined
                ) {

                    correctAnswer =
                        options[index];

                }

            }


            /* =================================
               LETTER ANSWER
               Example: "A"
            ================================= */

            if (
                typeof correctAnswer ===
                    "string" &&
                /^[A-D]$/i.test(
                    correctAnswer.trim()
                )
            ) {

                const index =
                    correctAnswer
                        .trim()
                        .toUpperCase()
                        .charCodeAt(0) - 65;


                if (
                    options[index] !==
                    undefined
                ) {

                    correctAnswer =
                        options[index];

                }

            }


            return {

                question:
                    String(
                        q.question ??
                        q.text ??
                        ""
                    ).trim(),


                options:
                    options,


                answer:
                    String(
                        correctAnswer ??
                        ""
                    ).trim(),


                explanation:
                    String(
                        q.explanation ??
                        ""
                    ).trim()

            };

        })

        .filter(q =>

            q.question &&
            q.options.length === 4 &&
            q.answer

        );

}


/* =========================================
   RENDER QUESTION
========================================= */

function renderQuizQuestion() {

    const quizArea =
        document.getElementById(
            "quizArea"
        );


    if (
        !quizArea ||
        !generatedQuiz.length
    ) {

        return;

    }


    const q =
        generatedQuiz[
            currentQuestion
        ];


    if (!q) {
        return;
    }


    const selected =
        selectedAnswers[
            currentQuestion
        ];


    const isLast =
        currentQuestion ===
        generatedQuiz.length - 1;


    quizArea.innerHTML = `

        <div class="quiz-running">

            <div class="quiz-top">

                <div>

                    <span class="quiz-progress-text">

                        Question
                        ${currentQuestion + 1}
                        of
                        ${generatedQuiz.length}

                    </span>


                    <h3
                        class="quiz-question"
                    >

                        ${escapeHTML(
                            q.question
                        )}

                    </h3>

                </div>


                ${
                    quizSecondsLeft > 0
                        ? `

                            <div
                                class="quiz-timer"
                                id="quizTimer"
                            >

                                ${formatTime(
                                    quizSecondsLeft
                                )}

                            </div>

                          `
                        : ""
                }

            </div>


            <div class="options">

                ${q.options.map(
                    (option, index) => {

                        const isSelected =
                            selected === index;


                        return `

                            <button
                                type="button"
                                class="option ${
                                    isSelected
                                        ? "selected"
                                        : ""
                                }"
                                onclick="selectQuizOption(${index})"
                            >

                                <span
                                    class="option-letter"
                                >
                                    ${String.fromCharCode(
                                        65 + index
                                    )}
                                </span>


                                <span>
                                    ${escapeHTML(
                                        option
                                    )}
                                </span>

                            </button>

                        `;

                    }
                ).join("")}

            </div>


            <div class="quiz-actions">

                <button
                    type="button"
                    class="quiz-nav-btn"
                    onclick="previousQuestion()"
                    ${
                        currentQuestion === 0
                            ? "disabled"
                            : ""
                    }
                >
                    Previous
                </button>


                ${
                    isLast

                        ? `

                            <button
                                type="button"
                                class="quiz-nav-btn primary"
                                onclick="finishQuiz(false)"
                            >
                                Submit Quiz
                            </button>

                          `

                        : `

                            <button
                                type="button"
                                class="quiz-nav-btn primary"
                                onclick="nextQuestion()"
                            >
                                Next
                            </button>

                          `
                }

            </div>

        </div>

    `;


    if (
        typeof lucide !== "undefined"
    ) {

        lucide.createIcons();

    }


    updateTimerDisplay();

}


/* =========================================
   SELECT OPTION
========================================= */

function selectQuizOption(index) {

    if (
        !generatedQuiz[
            currentQuestion
        ]
    ) {

        return;

    }


    /*
       IMPORTANT:
       We store OPTION INDEX,
       not option text.
    */

    selectedAnswers[
        currentQuestion
    ] = index;


    console.log(
        `Question ${currentQuestion + 1} selected option:`,
        index,
        generatedQuiz[
            currentQuestion
        ].options[index]
    );


    renderQuizQuestion();

}


/* =========================================
   NEXT QUESTION
========================================= */

function nextQuestion() {

    if (
        currentQuestion <
        generatedQuiz.length - 1
    ) {

        currentQuestion++;

        renderQuizQuestion();

    }

}


/* =========================================
   PREVIOUS QUESTION
========================================= */

function previousQuestion() {

    if (
        currentQuestion > 0
    ) {

        currentQuestion--;

        renderQuizQuestion();

    }

}


/* =========================================
   TIMER
========================================= */

function startQuizTimer() {

    clearInterval(
        quizTimerInterval
    );


    quizTimerInterval =
        setInterval(
            () => {

                quizSecondsLeft--;


                updateTimerDisplay();


                if (
                    quizSecondsLeft <= 0
                ) {

                    clearInterval(
                        quizTimerInterval
                    );


                    finishQuiz(true);

                }

            },
            1000
        );

}


/* =========================================
   TIMER DISPLAY
========================================= */

function updateTimerDisplay() {

    const timer =
        document.getElementById(
            "quizTimer"
        );


    if (!timer) {
        return;
    }


    timer.textContent =
        formatTime(
            quizSecondsLeft
        );

}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(
    seconds
) {

    const safeSeconds =
        Math.max(
            0,
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            safeSeconds / 60
        );


    const remainingSeconds =
        safeSeconds % 60;


    return `${String(
        minutes
    ).padStart(
        2,
        "0"
    )}:${String(
        remainingSeconds
    ).padStart(
        2,
        "0"
    )}`;

}


/* =========================================
   FINISH QUIZ
========================================= */

async function finishQuiz(
    timeUp = false
) {

    clearInterval(
        quizTimerInterval
    );


    if (
        !generatedQuiz.length
    ) {

        return;

    }


    let correct = 0;


    console.log(
        "================================"
    );

    console.log(
        "QUIZ RESULT CHECK"
    );

    console.log(
        "================================"
    );


    generatedQuiz.forEach(
        (question, index) => {

            const selectedIndex =
                selectedAnswers[index];


            let selectedAnswer =
                null;


            if (
                selectedIndex !==
                    null &&
                selectedIndex !==
                    undefined
            ) {

                selectedAnswer =
                    question.options[
                        selectedIndex
                    ];

            }


            const correctAnswer =
                question.answer;


            const isCorrect =
                selectedAnswer !== null &&
                normalizeAnswer(
                    selectedAnswer
                ) ===
                normalizeAnswer(
                    correctAnswer
                );


            console.log(
                `Q${index + 1}:`,
                {
                    selectedIndex:
                        selectedIndex,

                    selectedAnswer:
                        selectedAnswer,

                    correctAnswer:
                        correctAnswer,

                    isCorrect:
                        isCorrect
                }
            );


            if (isCorrect) {

                correct++;

            }

        }
    );


    const total =
        generatedQuiz.length;


    const wrong =
        total - correct;


    const percentage =
        total > 0
            ? Math.round(
                (correct / total) *
                100
            )
            : 0;


    console.log(
        "================================"
    );

    console.log(
        "FINAL RESULT"
    );

    console.log({

        correct:
            correct,

        wrong:
            wrong,

        total:
            total,

        percentage:
            percentage

    });

    console.log(
        "================================"
    );


    /*
       Show result first.
    */

    showQuizResult(
        correct,
        wrong,
        total,
        percentage,
        timeUp
    );


    /*
       Save correct result to Supabase.
    */

    await saveQuizResult(
        correct,
        total,
        percentage
    );

}


/* =========================================
   SAVE RESULT TO SUPABASE
========================================= */

async function saveQuizResult(
    correct,
    total,
    percentage
) {

    if (!currentUser) {

        console.log(
            "No logged-in user. Result not saved."
        );

        return;

    }


    try {

        const subject =
            document.getElementById(
                "quizSubject"
            )?.value || null;


        const topic =
            document.getElementById(
                "quizTopic"
            )?.value || null;


        const {
            error
        } = await supabaseClient
            .from("quiz_results")
            .insert({

                user_id:
                    currentUser.id,

                subject:
                    subject,

                topic:
                    topic,

                score:
                    correct,

                total_questions:
                    total,

                percentage:
                    percentage,

                quiz_title:
                    "AI Quiz"

            });


        if (error) {

            console.error(
                "Could not save quiz result:",
                error.message
            );


            return;

        }


        console.log(
            "Quiz result saved successfully."
        );


    } catch (error) {

        console.error(
            "Result save error:",
            error
        );

    }

}
